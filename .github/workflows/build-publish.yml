name: Build And Publish

on:
  workflow_call:
    inputs:
      build_config_path:
        required: true
        type: string
      platform_repo:
        required: false
        type: string
        default: mark-devlab2/aliyun-deploy-platform
      platform_ref:
        required: false
        type: string
        default: main
      deploy_target:
        required: false
        type: string
        default: ""
    outputs:
      service_id:
        value: ${{ jobs.build_publish.outputs.service_id }}
      image_tag:
        value: ${{ jobs.build_publish.outputs.image_tag }}
      deploy_target:
        value: ${{ jobs.build_publish.outputs.deploy_target }}

permissions:
  contents: read
  packages: write

jobs:
  build_publish:
    runs-on: ubuntu-latest
    outputs:
      service_id: ${{ steps.contract.outputs.service_id }}
      image_tag: ${{ steps.build.outputs.image_tag }}
      deploy_target: ${{ steps.target.outputs.deploy_target }}
    steps:
      - name: Checkout service repository
        uses: actions/checkout@v4

      - name: Checkout deploy platform repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.platform_repo }}
          ref: ${{ inputs.platform_ref }}
          path: .deploy-platform
          token: ${{ secrets.PLATFORM_REPO_TOKEN || github.token }}

      - name: Resolve build contract
        id: contract
        run: |
          python3 .deploy-platform/scripts/render-config.py build-contract "${{ inputs.build_config_path }}" > contract.json
          python3 - <<'PY'
          import json
          import os

          doc = json.load(open("contract.json", "r", encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"service_id={doc['serviceId']}\n")
              fh.write(f"default_target={doc.get('deploy', {}).get('defaultTarget', 'full')}\n")
          PY

      - name: Run tests
        run: |
          TEST_COMMAND="$(python3 - <<'PY'
          import json

          doc = json.load(open("contract.json", "r", encoding="utf-8"))
          print(doc.get("test", {}).get("run", ""))
          PY
          )"
          if [ -z "$TEST_COMMAND" ]; then
            echo "test.run is required in .deploy/build.yaml" >&2
            exit 1
          fi
          sh -lc "$TEST_COMMAND"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish images
        id: build
        run: ./.deploy-platform/scripts/build-and-publish.sh contract.json "${{ github.sha }}"

      - name: Resolve deploy target
        id: target
        run: |
          DEPLOY_TARGET="${{ inputs.deploy_target }}"
          if [ -z "$DEPLOY_TARGET" ]; then
            DEPLOY_TARGET="${{ steps.contract.outputs.default_target }}"
          fi
          printf 'deploy_target=%s\n' "$DEPLOY_TARGET" >>"$GITHUB_OUTPUT"
