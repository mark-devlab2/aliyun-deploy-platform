name: Deploy Service

on:
  workflow_call:
    inputs:
      service_id:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      target:
        required: true
        type: string
      platform_repo:
        required: false
        type: string
        default: mark-devlab2/aliyun-deploy-platform
      platform_ref:
        required: false
        type: string
        default: v1
      remote_platform_dir:
        required: false
        type: string
        default: /opt/aliyun-deploy-platform

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy platform repository
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.platform_repo }}
          ref: ${{ inputs.platform_ref }}
          path: .deploy-platform
          token: ${{ secrets.PLATFORM_REPO_TOKEN || github.token }}

      - name: Start SSH agent
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >>"$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >>"$GITHUB_ENV"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-add - <<< "$SSH_PRIVATE_KEY"

      - name: Configure known hosts
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_SSH_KNOWN_HOSTS: ${{ secrets.ALIYUN_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          if [ -n "$ALIYUN_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$ALIYUN_SSH_KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -H "$ALIYUN_HOST" >"$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Bootstrap remote platform repository
        env:
          PLATFORM_GIT_URL: ${{ secrets.PLATFORM_GIT_URL }}
          REMOTE_PORT: ${{ secrets.ALIYUN_SSH_PORT }}
        run: |
          if [ -z "${PLATFORM_GIT_URL:-}" ]; then
            PLATFORM_GIT_URL="https://github.com/${{ inputs.platform_repo }}.git"
          fi
          ./.deploy-platform/scripts/bootstrap-server.sh \
            --remote-host "${{ secrets.ALIYUN_HOST }}" \
            --remote-user "${{ secrets.ALIYUN_SSH_USER }}" \
            --remote-port "${REMOTE_PORT:-22}" \
            --platform-dir "${{ inputs.remote_platform_dir }}" \
            --platform-git-url "$PLATFORM_GIT_URL" \
            --platform-ref "${{ inputs.platform_ref }}" \
            --service-id "${{ inputs.service_id }}"

      - name: Trigger remote deploy
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_SSH_USER: ${{ secrets.ALIYUN_SSH_USER }}
          ALIYUN_SSH_PORT: ${{ secrets.ALIYUN_SSH_PORT }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          GHCR_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          ACR_USERNAME_B64="$(printf '%s' "$ACR_USERNAME" | base64 | tr -d '\n')"
          ACR_PASSWORD_B64="$(printf '%s' "$ACR_PASSWORD" | base64 | tr -d '\n')"
          GHCR_USERNAME_B64="$(printf '%s' "$GHCR_USERNAME" | base64 | tr -d '\n')"
          GHCR_TOKEN_B64="$(printf '%s' "$GHCR_TOKEN" | base64 | tr -d '\n')"
          REMOTE_PORT="${ALIYUN_SSH_PORT:-22}"
          ssh -p "$REMOTE_PORT" -o ConnectTimeout=10 "$ALIYUN_SSH_USER@$ALIYUN_HOST" \
            "bash -s -- '${{ inputs.remote_platform_dir }}' '${{ inputs.service_id }}' '${{ inputs.target }}' '${{ inputs.image_tag }}' '$ACR_USERNAME_B64' '$ACR_PASSWORD_B64' '$GHCR_USERNAME_B64' '$GHCR_TOKEN_B64'" <<'REMOTE'
          set -eu
          PLATFORM_DIR="$1"
          SERVICE_ID="$2"
          TARGET="$3"
          IMAGE_TAG="$4"
          ACR_USERNAME_B64="$5"
          ACR_PASSWORD_B64="$6"
          GHCR_USERNAME_B64="$7"
          GHCR_TOKEN_B64="$8"

          if [ -n "$ACR_USERNAME_B64" ] && [ -n "$ACR_PASSWORD_B64" ]; then
            export ACR_USERNAME="$(printf '%s' "$ACR_USERNAME_B64" | base64 -d)"
            export ACR_PASSWORD="$(printf '%s' "$ACR_PASSWORD_B64" | base64 -d)"
          fi

          if [ -n "$GHCR_USERNAME_B64" ] && [ -n "$GHCR_TOKEN_B64" ]; then
            export GHCR_USERNAME="$(printf '%s' "$GHCR_USERNAME_B64" | base64 -d)"
            export GHCR_TOKEN="$(printf '%s' "$GHCR_TOKEN_B64" | base64 -d)"
          fi

          "$PLATFORM_DIR/scripts/deploy-service.sh" \
            --platform-dir "$PLATFORM_DIR" \
            --service-id "$SERVICE_ID" \
            --target "$TARGET" \
            --image-tag "$IMAGE_TAG"
          REMOTE

      - name: Summarize remote deploy attempt
        if: always()
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_SSH_USER: ${{ secrets.ALIYUN_SSH_USER }}
          ALIYUN_SSH_PORT: ${{ secrets.ALIYUN_SSH_PORT }}
        run: |
          REMOTE_PORT="${ALIYUN_SSH_PORT:-22}"
          remote_attempt_path="${{ inputs.remote_platform_dir }}/runtime/${{ inputs.service_id }}/releases/last_attempt.json"
          if ssh -p "$REMOTE_PORT" -o ConnectTimeout=10 "$ALIYUN_SSH_USER@$ALIYUN_HOST" "test -f '$remote_attempt_path'"; then
            ssh -p "$REMOTE_PORT" -o ConnectTimeout=10 "$ALIYUN_SSH_USER@$ALIYUN_HOST" "cat '$remote_attempt_path'" >release-attempt.json
            python3 ./.deploy-platform/scripts/render-release-summary.py release-attempt.json >>"$GITHUB_STEP_SUMMARY"
            echo "" >>"$GITHUB_STEP_SUMMARY"
            echo '```json' >>"$GITHUB_STEP_SUMMARY"
            cat release-attempt.json >>"$GITHUB_STEP_SUMMARY"
            echo '```' >>"$GITHUB_STEP_SUMMARY"
          else
            echo "No remote deploy attempt file found at $remote_attempt_path" >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Stop SSH agent
        if: always()
        run: |
          if [ -n "${SSH_AGENT_PID:-}" ]; then
            ssh-agent -k >/dev/null
          fi
