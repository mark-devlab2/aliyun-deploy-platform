services:
  api:
    image: "${API_IMAGE}"
    ports:
      - "${API_PUBLISH}"
    env_file:
      - ../../runtime/feishu-token-service/service.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  admin-web:
    image: "${ADMIN_WEB_IMAGE}"
    depends_on:
      api:
        condition: service_started

  caddy:
    image: caddy:2
    ports:
      - "${CADDY_HTTP_PUBLISH:-80:80}"
      - "${CADDY_HTTPS_PUBLISH:-443:443}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
      admin-web:
        condition: service_started
    networks:
      default:
      public-edge:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-feishu_token_service}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    ports:
      - "${POSTGRES_PUBLISH:-5433:5432}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-feishu_token_service}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "${REDIS_PUBLISH:-6380:6379}"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  public-edge:
    name: "himark-public-edge"
    external: true
